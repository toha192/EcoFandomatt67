<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoFandomat — Smart Plastic Recycling</title>
<meta name="theme-color" content="#052e22">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f0fdf6;--bg2:#d1fae5;--card:rgba(255,255,255,.72);--bd:rgba(5,150,105,.2);--tx:#052e22;--mu:#3f6b5a;--em:#059669;--em2:#10b981;--nav:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#03130d;--bg2:#06402c;--card:rgba(255,255,255,.07);--bd:rgba(110,231,183,.18);--tx:#ecfdf5;--mu:#8fc9b0;--em:#34d399;--em2:#10b981;--nav:rgba(3,19,13,.85)}}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 60%) fixed;background-color:var(--bg)}
.glass{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px}
.btn{background:linear-gradient(135deg,#10b981,#047857);color:#fff;font-weight:800;border-radius:16px;padding:14px 22px;width:100%;box-shadow:0 10px 30px -8px rgba(16,185,129,.6);transition:.2s}
.btn:active{transform:scale(.97)}.btn2{background:var(--card);border:1px solid var(--bd);color:var(--tx);box-shadow:none}
.mu{color:var(--mu)}.em{color:var(--em)}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}.up{animation:up .5s ease both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fall{0%{transform:translateY(-70px) rotate(0);opacity:0}15%{opacity:1}70%{transform:translateY(40px) rotate(180deg);opacity:1}100%{transform:translateY(60px) rotate(180deg) scale(.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes conf{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 0 18px rgba(16,185,129,0)}0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}}
.ck{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .5s ease forwards}
.cf{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:2px;animation:conf 1.4s ease-out both}
.nav{background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef}=React;const html=htm.bind(React.createElement);
const P={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
check:'<path d="M20 6 9 17l-5-5"/>',leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6.5C9.5 13.7 12 13 12 13"/>',
rec:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
award:'<circle cx="12" cy="8" r="6"/><path d="M15.5 13.9 17 22l-5-3-5 3 1.5-8.1"/>',zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>'};
const I=({n,s=20,c=''})=>html`<svg className=${c} width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML=${{__html:P[n]}}/>`;

let KEY='ecofandomat.v1';const PTS=10,CO2=0.08,UK='ecofandomat.users',SK='ecofandomat.session',PK='ecofandomat.pending',UD='ecofandomat.used';
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sha=async t=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ef:'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(t)))}};
const setKey=e=>{KEY='ecofandomat.u.'+e};
const TIERS=[{p:50,n:'Bronze Eco Badge',c:'#cd7f32'},{p:100,n:'Silver Eco Badge',c:'#c0c8d0'},{p:250,n:'Gold Eco Badge',c:'#facc15'},{p:500,n:'Eco Champion',c:'#34d399'}];
const LEVELS=['Seedling','Sprout','Eco Warrior','Green Guardian','Planet Hero'];
const fmt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const rid=()=>Math.random().toString(36).slice(2,8);
function init(){const now=Date.now(),b=[];for(let i=0;i<11;i++)b.push({id:'EF-'+(48210+i*7),t:now-(i+1)*26*36e5-i*91e4});
return{bottles:b,spent:0,claimed:[],scans:[],seen:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.bottles)return s}catch(e){}return init()}
function useCount(to,d=900){const[v,setV]=useState(0);useEffect(()=>{let r,t0;const f=t=>{t0=t0||t;const k=Math.min(1,(t-t0)/d);setV(Math.round(to*k));if(k<1)r=requestAnimationFrame(f)};r=requestAnimationFrame(f);return()=>cancelAnimationFrame(r)},[to]);return v}

function Auth({done,pending}){const[m,setM]=useState('up'),[f,setF]=useState({name:'',email:'',pw:''}),[err,setErr]=useState(''),[busy,setB]=useState(false);
const set=k=>e=>setF({...f,[k]:e.target.value});const IS={background:'var(--card)',border:'1px solid var(--bd)',color:'var(--tx)',fontSize:16};
const sub=async e=>{e.preventDefault();setErr('');const em=f.email.trim().toLowerCase();
if(m==='up'&&!f.name.trim())return setErr('Enter your name');
if(!/^\S+@\S+\.\S+$/.test(em))return setErr('Enter a valid email');
if(f.pw.length<6)return setErr('Password must be at least 6 characters');
setB(true);const h=await sha(f.pw),us=jget(UK,{});
if(m==='up'){if(us[em]){setB(false);return setErr('Account already exists — please log in')}us[em]={name:f.name.trim(),h};try{localStorage.setItem(UK,JSON.stringify(us))}catch(x){}}
else if(!us[em]||us[em].h!==h){setB(false);return setErr('Wrong email or password')}
done(em,us[em].name,m==='up')};
return html`<div className="min-h-screen flex flex-col justify-center p-6 max-w-md mx-auto up">
<div className="w-14 h-14 rounded-2xl flex items-center justify-center text-white mb-5" style=${{background:'linear-gradient(135deg,#10b981,#047857)'}}><${I} n="rec" s=${28}/></div>
<h1 className="text-3xl font-extrabold">${m==='up'?'Create account':'Welcome back'}</h1>
<p className="mu mt-1 mb-5">${pending?'Your bottle is accepted! Sign in to claim your EcoPoints.':'Save your EcoPoints and rewards to your account.'}</p>
<div className="glass p-1 flex mb-4">${[['up','Sign up'],['in','Log in']].map(([k,l])=>html`<button type="button" key=${k} onClick=${()=>{setM(k);setErr('')}} className="flex-1 py-2.5 rounded-2xl font-bold" style=${{background:m===k?'#059669':'transparent',color:m===k?'#fff':'var(--mu)'}}>${l}</button>`)}</div>
<form onSubmit=${sub} className="space-y-3">${m==='up'&&html`<input style=${IS} className="w-full rounded-2xl px-4 py-3.5 outline-none" placeholder="Your name" autoComplete="name" value=${f.name} onChange=${set('name')}/>`}
<input style=${IS} className="w-full rounded-2xl px-4 py-3.5 outline-none" type="email" placeholder="Email" autoComplete="email" value=${f.email} onChange=${set('email')}/>
<input style=${IS} className="w-full rounded-2xl px-4 py-3.5 outline-none" type="password" placeholder="Password (min 6 characters)" autoComplete=${m==='up'?'new-password':'current-password'} value=${f.pw} onChange=${set('pw')}/>
${err&&html`<div className="text-sm font-semibold" style=${{color:'#f87171'}}>${err}</div>`}
<button className="btn" type="submit" disabled=${busy}>${m==='up'?'Sign up & continue':'Log in'}</button></form>
<p className="text-xs mu mt-5">Demo only: accounts are stored in this browser. A real product needs a server with secure authentication.</p></div>`}
function Welcome({go}){return html`<div className="min-h-screen flex flex-col justify-between p-6 max-w-md mx-auto">
<div className="pt-10 up"><div className="w-16 h-16 rounded-2xl flex items-center justify-center text-white" style=${{background:'linear-gradient(135deg,#10b981,#047857)'}}><${I} n="rec" s=${32}/></div>
<h1 className="text-5xl font-extrabold mt-8 leading-tight">Eco<span className="em">Fandomat</span></h1>
<p className="mu mt-3 text-lg">Smart plastic recycling. Insert a bottle, scan the QR, earn EcoPoints.</p></div>
<div className="space-y-3 my-8">${[['rec','AI recognises your bottle'],['zap','Get +10 EcoPoints instantly'],['gift','Exchange points for eco badges']].map(([n,t],i)=>html`<div key=${n} className="glass p-4 flex items-center gap-3 up" style=${{animationDelay:i*.12+'s'}}><span className="em"><${I} n=${n}/></span><b>${t}</b></div>`)}</div>
<button className="btn" onClick=${go}>Get started</button></div>`}

function Success({s,dup,go,again}){const n=useCount(dup?0:PTS);const conf=Array.from({length:22},(_,i)=>({x:Math.cos(i)*(90+i*5),y:Math.sin(i*1.7)*(90+i*4),c:['#10b981','#facc15','#6ee7b7','#fff'][i%4],d:i*.03}));
return html`<div className="min-h-screen flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto">
<div className="relative w-36 h-36 mb-6">${!dup&&conf.map((c,i)=>html`<i key=${i} className="cf" style=${{'--x':c.x+'px','--y':c.y+'px',background:c.c,animationDelay:.6+c.d+'s'}}/>`)}
<div className="pop w-36 h-36 rounded-full flex items-center justify-center" style=${{background:'linear-gradient(135deg,#34d399,#047857)',animation:'pop .6s both,glow 1.6s 1s 2'}}>
<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path className="ck" d="M20 6 9 17l-5-5"/></svg></div></div>
<h1 className="text-4xl font-extrabold up" style=${{animationDelay:'.6s'}}>${dup?'ALREADY COUNTED':'BOTTLE ACCEPTED!'}</h1>
<p className="mu mt-2 up" style=${{animationDelay:'.75s'}}>${dup?'This QR code has already been used. Points are credited only once.':'Thank you for making our planet greener!'}</p>
${!dup&&html`<div className="relative h-24 w-24 my-4 up" style=${{animationDelay:'.9s'}}><div className="absolute inset-x-0 bottom-0 h-8 rounded-xl glass flex items-center justify-center em"><${I} n="rec" s=${18}/></div>
<svg className="absolute left-1/2 -ml-4" style=${{animation:'fall 2.4s 1s infinite'}} width="32" height="56" viewBox="0 0 32 56"><rect x="11" y="0" width="10" height="9" rx="2" fill="#6ee7b7"/><rect x="5" y="8" width="22" height="46" rx="9" fill="#10b981" fillOpacity=".85"/></svg></div>`}
<div className="glass px-8 py-5 my-4 pop" style=${{animationDelay:'1s'}}><div className="text-5xl font-extrabold em">+${n} <span className="text-2xl">EcoPoints</span></div></div>
<p className="mu mb-8">${dup?'No new points this time.':'You have successfully recycled 1 plastic bottle.'}</p>
<div className="w-full space-y-3"><button className="btn" onClick=${go}>Go to Dashboard</button><button className="btn btn2" onClick=${again}>Recycle Another Bottle</button></div></div>`}

function Dash({s,pts,lvl,go}){const b=s.bottles,co=(b.length*CO2).toFixed(1),lp=(b.length*PTS)%100;
const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return{l:d.toLocaleDateString('en',{weekday:'short'}),n:b.filter(x=>x.t>=d&&x.t<d.getTime()+864e5).length}});const mx=Math.max(1,...days.map(d=>d.n));
const St=({n,v,l})=>html`<div className="glass p-4"><span className="em"><${I} n=${n}/></span><div className="text-2xl font-extrabold mt-2">${v}</div><div className="mu text-xs">${l}</div></div>`;
return html`<div className="space-y-4 up"><div className="glass p-5" style=${{background:'linear-gradient(135deg,rgba(16,185,129,.35),rgba(4,120,87,.2))'}}>
<div className="mu text-sm">Total EcoPoints</div><div className="text-5xl font-extrabold">${pts}</div>
<div className="flex justify-between text-sm mt-4"><b>Level ${lvl+1}: ${LEVELS[Math.min(lvl,4)]}</b><span className="mu">${lp}/100</span></div>
<div className="h-2.5 rounded-full mt-1.5" style=${{background:'var(--bd)'}}><div className="h-full rounded-full" style=${{width:lp+'%',background:'#10b981',transition:'width 1s'}}/></div></div>
<div className="grid grid-cols-2 gap-3"><${St} n="rec" v=${b.length} l="Bottles Recycled"/><${St} n="leaf" v=${co+' kg'} l="CO₂ Saved (estimate)"/></div>
<div className="glass p-5"><b>Last 7 days</b><div className="flex items-end justify-between gap-2 h-28 mt-3">${days.map(d=>html`<div key=${d.l} className="flex-1 flex flex-col items-center justify-end h-full gap-1"><div className="w-full rounded-lg" style=${{height:Math.max(6,d.n/mx*80)+'%',background:d.n?'linear-gradient(#34d399,#047857)':'var(--bd)',transition:'height .8s'}}/><span className="text-[10px] mu">${d.l}</span></div>`)}</div></div>
<div className="glass p-5"><b>Environmental Impact</b><div className="grid grid-cols-3 text-center mt-3 gap-2">${[[(b.length*.025).toFixed(2),'kg plastic'],[(b.length*.3).toFixed(1),'Wh energy kept'],[(b.length*CO2/21).toFixed(2),'trees / year']].map(([v,l])=>html`<div key=${l}><div className="text-xl font-extrabold em">${v}</div><div className="text-[11px] mu">${l}</div></div>`)}</div></div>
<button className="btn btn2" onClick=${()=>go('history')}>View history</button></div>`}

function Rewards({s,pts,claim}){const nx=TIERS.find(t=>!s.claimed.includes(t.n));
return html`<div className="space-y-4 up"><h2 className="text-2xl font-extrabold">EcoRewards</h2>
<div className="glass p-5"><div className="mu text-sm">Available points</div><div className="text-4xl font-extrabold em">${pts}</div>
${nx?html`<div className="text-sm mt-3 mu">Next: <b className="text-inherit">${nx.n}</b> — ${Math.max(0,nx.p-pts)} pts to go</div><div className="h-2.5 rounded-full mt-1.5" style=${{background:'var(--bd)'}}><div className="h-full rounded-full" style=${{width:Math.min(100,pts/nx.p*100)+'%',background:'#10b981',transition:'width 1s'}}/></div>`:html`<div className="mt-3 font-bold em">All rewards unlocked 🎉</div>`}</div>
${TIERS.map(t=>{const own=s.claimed.includes(t.n),ok=pts>=t.p;return html`<div key=${t.n} className="glass p-4 flex items-center gap-4"><div className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0" style=${{background:t.c+'33',color:t.c}}><${I} n="award" s=${28}/></div>
<div className="flex-1 min-w-0"><b>${t.n}</b><div className="mu text-sm">${t.p} points</div></div>
${own?html`<span className="em font-bold text-sm flex items-center gap-1"><${I} n="check" s=${16}/>Owned</span>`:html`<button disabled=${!ok} onClick=${()=>claim(t)} className="px-4 py-2 rounded-xl font-bold text-sm text-white" style=${{background:ok?'#059669':'var(--bd)',opacity:ok?1:.7}}>${ok?'Redeem':html`<${I} n="lock" s=${16}/>`}</button>`}</div>`})}
<p className="text-xs mu">Demo: redeeming deducts points from your balance (stored in this browser only).</p></div>`}

function History({s}){return html`<div className="space-y-3 up"><h2 className="text-2xl font-extrabold">Recycling History</h2>
${s.bottles.map(b=>html`<div key=${b.id} className="glass p-4"><div className="flex justify-between items-center"><b>${b.id}</b><span className="em font-extrabold">+${PTS} EcoPoints</span></div>
<div className="flex flex-wrap gap-x-4 gap-y-1 text-sm mu mt-1.5"><span>${fmt(b.t)}</span><span>Material: Plastic</span><span className="em font-semibold">● Accepted</span></div></div>`)}</div>`}

function Profile({s,pts,lvl,reset,user,logout}){const n=s.bottles.length,earned=n*PTS;
const AC=[['First Bottle',n>=1,'rec'],['5 Bottles',n>=5,'leaf'],['10 Bottles',n>=10,'zap'],['25 Bottles',n>=25,'globe'],['250 Points earned',earned>=250,'trophy'],['Badge Collector',s.claimed.length>=2,'award']];
const lb=[['EcoMax',410],['Aigerim K.',320],['GreenAlmas',270],['Dana_R',190],['You',earned],['Nurlan B.',60]].sort((a,b)=>b[1]-a[1]);
return html`<div className="space-y-4 up"><div className="glass p-5 flex items-center gap-4"><div className="w-16 h-16 rounded-full flex items-center justify-center text-white text-2xl font-extrabold" style=${{background:'linear-gradient(135deg,#10b981,#047857)'}}>${user.name[0].toUpperCase()}</div>
<div><div className="text-xl font-extrabold">${user.name}</div><div className="mu text-xs">${user.em}</div><div className="mu text-sm">Level ${lvl+1} · ${LEVELS[Math.min(lvl,4)]}</div><div className="text-sm em font-bold">${pts} EcoPoints</div></div></div>
<h3 className="font-extrabold pt-1">EcoAchievements</h3><div className="grid grid-cols-2 gap-3">${AC.map(([t,ok,ic])=>html`<div key=${t} className="glass p-4 text-center" style=${{opacity:ok?1:.5}}><span className=${ok?'em':'mu'}><${I} n=${ok?ic:'lock'} s=${26}/></span><div className="text-sm font-bold mt-1">${t}</div></div>`)}</div>
<h3 className="font-extrabold pt-1">Leaderboard <span className="text-xs mu font-normal">(demo data)</span></h3>
<div className="glass divide-y" style=${{borderColor:'var(--bd)'}}>${lb.map(([nm,p],i)=>html`<div key=${nm} className="flex items-center gap-3 p-3.5" style=${{background:nm==='You'?'rgba(16,185,129,.2)':'',borderTop:i?'1px solid var(--bd)':''}}><b className="w-6 em">${i+1}</b><span className="flex-1 font-semibold">${nm}</span><b>${p}</b></div>`)}</div>
<button className="btn btn2" onClick=${logout}>Log out</button><button className="btn btn2" onClick=${reset}>Reset demo data</button>
<p className="text-xs mu">Demo only: points live in localStorage. A real system needs a server and one-time QR tokens verified by the machine — opening a link alone must not prove recycling.</p></div>`}

function App(){const ses=jget(SK,null);if(ses&&KEY==='ecofandomat.v1')setKey(ses.em);const[user,setUser]=useState(ses),[s,setS]=useState(load),[scr,setScr]=useState(ses?'home':(/[?&]scan=/.test(location.search)?'auth':'welcome')),[dup,setDup]=useState(false),[toast,setToast]=useState('');
const first=useRef(true);const save=x=>{setS(x);try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}};
const add=(st,id)=>{try{localStorage.setItem(UD,JSON.stringify([...jget(UD,[]),id]))}catch(e){}return{...st,seen:true,scans:[...st.scans,id],bottles:[{id:'EF-'+id.toUpperCase().slice(0,8),t:Date.now()},...st.bottles]}};
const note=m=>{setToast(m);setTimeout(()=>setToast(''),2600)};
useEffect(()=>{if(!first.current)return;first.current=false;let sc=null;try{sc=new URLSearchParams(location.search).get('scan')}catch(e){}
if(sc){try{history.replaceState(null,'',location.pathname+'#done')}catch(e){}
if(!user){try{localStorage.setItem(PK,sc)}catch(e){}setScr('auth');return}
const st=load();if(jget(UD,[]).includes(sc)){setDup(true)}else{save(add(st,sc))}setScr('success')}},[]);
const earned=s.bottles.length*PTS,pts=earned-s.spent,lvl=Math.floor(earned/100);
const again=()=>{save(add(s,'demo'+rid()));setDup(false);setScr('success');window.scrollTo(0,0)};
const claim=t=>{if(pts<t.p)return;save({...s,spent:s.spent+t.p,claimed:[...s.claimed,t.n]});note('🎉 '+t.n+' unlocked!')};
const reset=()=>{if(confirm('Reset all demo data?')){save(init());note('Demo data reset')}};
const login=(em,name,isNew)=>{try{localStorage.setItem(SK,JSON.stringify({em,name}))}catch(e){}setKey(em);setUser({em,name});let st=isNew?{...init(),seen:true}:load();const p=localStorage.getItem(PK);let nx='home';setDup(false);
if(p){localStorage.removeItem(PK);if(jget(UD,[]).includes(p))setDup(true);else st=add(st,p);nx='success'}
save(st);setScr(nx);window.scrollTo(0,0)};
const logout=()=>{localStorage.removeItem(SK);setUser(null);setScr('auth');window.scrollTo(0,0)};
if(!user&&scr!=='welcome')return html`<${Auth} done=${login} pending=${!!localStorage.getItem(PK)}/>`;
if(scr==='welcome')return html`<${Welcome} go=${()=>setScr('auth')}/>`;
if(scr==='success')return html`<${Success} s=${s} dup=${dup} go=${()=>setScr('home')} again=${again}/>`;
const nav=[['home','dash','Dashboard'],['rewards','gift','Rewards'],['history','clock','History'],['profile','user','Profile']];
return html`<div className="max-w-md mx-auto px-4 pt-6 pb-28"><div className="flex items-center gap-2 mb-5 font-extrabold text-lg"><span className="em"><${I} n="rec" s=${22}/></span>Eco<span className="em">Fandomat</span></div>
${scr==='home'&&html`<${Dash} s=${s} pts=${pts} lvl=${lvl} go=${setScr}/>`}${scr==='rewards'&&html`<${Rewards} s=${s} pts=${pts} claim=${claim}/>`}${scr==='history'&&html`<${History} s=${s}/>`}${scr==='profile'&&html`<${Profile} s=${s} pts=${pts} lvl=${lvl} reset=${reset} user=${user} logout=${logout}/>`}
${toast&&html`<div className="fixed left-4 right-4 max-w-sm mx-auto glass px-4 py-3 text-center font-bold pop" style=${{top:'calc(env(safe-area-inset-top,0px) + 12px)',zIndex:30,background:'var(--nav)'}}>${toast}</div>`}
<nav className="nav fixed bottom-0 inset-x-0 z-20" style=${{paddingBottom:'env(safe-area-inset-bottom,0px)'}}><div className="max-w-md mx-auto flex">${nav.map(([k,ic,l])=>html`<button key=${k} onClick=${()=>{setScr(k);window.scrollTo(0,0)}} className=${'flex-1 py-3 flex flex-col items-center gap-0.5 text-[11px] font-bold '+(scr===k?'em':'mu')}><${I} n=${ic}/>${l}</button>`)}</div></nav></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
